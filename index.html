<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libreta</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Libreta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout: tablero personal con lógica de plano de arquitectura. El "plano" (azul cobalto con grilla) concentra los números del mes; alrededor, fichas blancas con líneas finas. Teléfono = barra inferior con + central; escritorio = índice lateral + tablero en grilla. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --sunk:#ECEEF2; --ink:#0D1017; --muted:#5C6371; --faint:#9AA0AC; --line:#E1E4EA;
  --accent:#2443E0; --on-ink:#FFFFFF;
  --plano:#2140D4; --plano-2:#1934B8; --on-plano:#FFFFFF; --grid:rgba(255,255,255,.085);
  --pos:#0E9F57; --neg:#E0413F; --warn:#E08A00;
  --pos-soft:#DCF4E7; --neg-soft:#FCE3E2; --warn-soft:#FCEFD6;
  --k1:#2443E0; --k2:#0E9F57; --k3:#E08A00; --k4:#D6457A; --k5:#0E9AA7; --k6:#7A5AF0; --k7:#6E8B12; --k8:#8A8F9C;
  --c-plata:#2443E0; --c-tareas:#E08A00; --c-agenda:#7A5AF0; --c-notas:#C99A00; --c-impuestos:#0E9AA7; --c-papeles:#D6457A; --c-auto:#55607A; --c-claves:#0D1017; --c-ajustes:#8A8F9C;
  --n-amber:#FDF6DD; --n-green:#E6F6EC; --n-blue:#E9EDFF; --n-rose:#FCEAF0; --n-none:#FFFFFF;
  --blur:rgba(242,243,246,.84);
  --shadow:0 1px 2px rgba(13,16,23,.04),0 10px 30px -14px rgba(13,16,23,.16);
  --f-disp:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090D; --surface:#11141B; --sunk:#1A1E27; --ink:#EDEFF5; --muted:#9AA1B0; --faint:#5E6574; --line:#222733;
  --accent:#7F95FF; --on-ink:#08090D;
  --plano:#1B2BA0; --plano-2:#141F7E; --on-plano:#FFFFFF; --grid:rgba(255,255,255,.07);
  --pos:#3DD68C; --neg:#FF6B66; --warn:#FFB547;
  --pos-soft:#0F2A1C; --neg-soft:#331615; --warn-soft:#33250D;
  --k1:#7F95FF; --k2:#3DD68C; --k3:#FFB547; --k4:#F27AA6; --k5:#4FCAD6; --k6:#AC95FF; --k7:#B5CF5A; --k8:#8F95A3;
  --c-plata:#7F95FF; --c-tareas:#FFB547; --c-agenda:#AC95FF; --c-notas:#E8C440; --c-impuestos:#4FCAD6; --c-papeles:#F27AA6; --c-auto:#9AA6C2; --c-claves:#EDEFF5; --c-ajustes:#8F95A3;
  --n-amber:#2A2412; --n-green:#11281A; --n-blue:#161D3A; --n-rose:#2D1520; --n-none:#11141B;
  --blur:rgba(8,9,13,.82);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090D; --surface:#11141B; --sunk:#1A1E27; --ink:#EDEFF5; --muted:#9AA1B0; --faint:#5E6574; --line:#222733;
  --accent:#7F95FF; --on-ink:#08090D;
  --plano:#1B2BA0; --plano-2:#141F7E; --on-plano:#FFFFFF; --grid:rgba(255,255,255,.07);
  --pos:#3DD68C; --neg:#FF6B66; --warn:#FFB547;
  --pos-soft:#0F2A1C; --neg-soft:#331615; --warn-soft:#33250D;
  --k1:#7F95FF; --k2:#3DD68C; --k3:#FFB547; --k4:#F27AA6; --k5:#4FCAD6; --k6:#AC95FF; --k7:#B5CF5A; --k8:#8F95A3;
  --c-plata:#7F95FF; --c-tareas:#FFB547; --c-agenda:#AC95FF; --c-notas:#E8C440; --c-impuestos:#4FCAD6; --c-papeles:#F27AA6; --c-auto:#9AA6C2; --c-claves:#EDEFF5; --c-ajustes:#8F95A3;
  --n-amber:#2A2412; --n-green:#11281A; --n-blue:#161D3A; --n-rose:#2D1520; --n-none:#11141B;
  --blur:rgba(8,9,13,.82);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.num,.amt,.kv{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.disp{font-family:var(--f-disp);font-stretch:112%;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1}
.cur{font-size:.56em;font-weight:600;margin-right:.14em;opacity:.62;vertical-align:.52em;letter-spacing:0}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
p{margin:0}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* Marco */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:flex-end;
  background:var(--blur);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.brand{display:none}
.nav a,.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--faint);font-size:11px;font-weight:500;padding:6px 4px;border-radius:12px;flex:1;max-width:84px;transition:color .2s}
.nav .on{color:var(--ink)}
.nav .on .ic{transform:translateY(-1px)}
.nav .dsk{display:none}
.nav .navplus{flex:none;width:56px;height:56px;max-width:none;padding:0;border-radius:19px;background:var(--plano);color:var(--on-plano);justify-content:center;margin:-22px 6px 4px;box-shadow:0 10px 24px -8px rgba(33,64,212,.6);transition:transform .2s var(--ease)}
.nav .navplus:active{transform:scale(.92)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px;min-width:0}
.wrap{max-width:1180px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top h1{font-family:var(--f-disp);font-stretch:112%;font-size:24px;font-weight:700;flex:1;letter-spacing:-.03em}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 18%,transparent)}
.sync.saving i{background:var(--warn)} .sync.err i,.sync.off i{background:var(--neg)} .sync.idle i{background:var(--faint);box-shadow:none}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:var(--muted);transition:background .15s,color .15s}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.fab{display:none}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:1px;border-top:0;border-right:1px solid var(--line);background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;overflow-y:auto;
    padding:calc(22px + env(safe-area-inset-top,0px)) 12px 18px max(12px,env(safe-area-inset-left,0px))}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 28px}
  .brand i{width:28px;height:28px;border-radius:9px;background:var(--plano);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:7px 7px;display:block}
  .brand b{font-family:var(--f-disp);font-stretch:118%;font-weight:700;font-size:18px;letter-spacing:-.03em}
  .nav a,.nav button{flex:none;max-width:none;flex-direction:row;gap:11px;font-size:14px;padding:9px 10px;color:var(--muted)}
  .nav a:hover{color:var(--ink);background:var(--sunk)}
  .nav .on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .nav .on .ic{color:var(--sc,var(--accent));transform:none}
  .nav .dsk{display:flex} .nav .mob{display:none}
  .nav .sep{margin-top:auto}
  main{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));padding-block:0 64px}
  .top{padding-block:28px 18px}
  .top h1{font-size:30px}
  .fab{position:fixed;z-index:25;display:grid;place-items:center;right:calc(32px + env(safe-area-inset-right,0px));bottom:calc(32px + env(safe-area-inset-bottom,0px));
    width:58px;height:58px;border-radius:19px;background:var(--plano);color:var(--on-plano);box-shadow:0 12px 28px -8px rgba(33,64,212,.6);transition:transform .2s var(--ease)}
  .fab:hover{transform:translateY(-2px)}
}

/* Movimiento */
@media (prefers-reduced-motion:no-preference){
  .view.enter>*{animation:rise .55s var(--ease) both}
  .view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}
  .view.enter>*:nth-child(5){animation-delay:.16s}.view.enter>*:nth-child(6){animation-delay:.2s}.view.enter>*:nth-child(7){animation-delay:.24s}.view.enter>*:nth-child(n+8){animation-delay:.28s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  .enter .chart .b{animation:grow .8s var(--ease) both;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes grow{from{transform:scaleY(0)}}
  .enter .seg-d{animation:sweep 1s var(--ease) both}
  @keyframes sweep{from{stroke-dasharray:0 400}}
  .enter .rg{animation:ringin 1.1s var(--ease) both .15s}
  @keyframes ringin{from{stroke-dasharray:0 100}}
  .enter .ln{stroke-dasharray:1;animation:draw 1.2s var(--ease) both .2s}
  @keyframes draw{from{stroke-dashoffset:1}}
  .enter .area{animation:fade 1s ease both .6s}
  @keyframes fade{from{opacity:0}}
  .enter .plan *{stroke-dasharray:1;animation:draw 2.2s ease both}
  .enter .hm i{animation:pop .45s var(--ease) both;animation-delay:var(--d)}
  @keyframes pop{from{opacity:0;transform:scale(.4)}}
  .enter .bar i,.enter .cota i,.enter .cb i{animation:fill .9s var(--ease) both .2s;transform-origin:left}
  @keyframes fill{from{transform:scaleX(0)}}
  .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.8);opacity:0}}
  .btn,.tile,.alert,.chip,.note,.cd,.menu button{transition:transform .15s var(--ease),background .15s,border-color .15s,box-shadow .2s}
  .btn:active,.tile:active,.chip:active,.note:active,.menu button:active{transform:scale(.97)}
  .tile:hover,.note:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .chk{transition:background .2s,border-color .2s,transform .2s var(--ease)}
  .task.done .chk{animation:tick .35s var(--ease)}
  @keyframes tick{50%{transform:scale(1.25)}}
  .scrim{animation:fade .2s ease}
  .sheet{animation:up .32s var(--ease)}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .toast{animation:toastin .3s var(--ease)}
  @keyframes toastin{from{transform:translate(-50%,12px);opacity:0}}
}

/* Piezas */
.view{display:flex;flex-direction:column;gap:16px}
.hello{display:flex;flex-direction:column;gap:2px}
.hello h2{font-family:var(--f-disp);font-stretch:115%;font-weight:700;font-size:clamp(28px,6vw,40px);letter-spacing:-.035em;line-height:1.05}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.kpi{padding:14px 16px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:6px}
.kpi>span:first-child{font-size:12.5px;color:var(--muted)}
.kpi .kv{font-family:var(--f-disp);font-stretch:112%;font-weight:700;letter-spacing:-.025em;font-size:clamp(20px,2.6vw,26px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.kpi .kv.pos{color:var(--pos)} .kpi .kv.neg{color:var(--neg)}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.grid3{grid-template-columns:1fr 1fr}}
@media (min-width:980px){.grid2{grid-template-columns:1fr 1fr}}
@media (min-width:1180px){.grid3{grid-template-columns:1.15fr 1fr 1fr}}
.span2{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.ch{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ch h3{font-size:15.5px}
.ch .ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;margin-right:8px;vertical-align:-8px;background:color-mix(in srgb,var(--sc,var(--accent)) 14%,transparent);color:var(--sc,var(--accent))}
.sub{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:4px}
.lnk{color:var(--muted);font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.lnk:hover{color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px}
.rt{font-weight:500;overflow-wrap:anywhere}
.rm{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12.5px;color:var(--muted);align-items:center}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);font-weight:500}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.pagado,.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.vencido{background:var(--neg-soft);color:var(--neg)}
.pill.pronto{background:var(--warn-soft);color:var(--warn)}
.pill.pendiente{background:var(--sunk);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:12px;font-weight:500;font-size:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--neg);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--neg);color:var(--on-ink)}
.btn:disabled{opacity:.6}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:6px 0;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-size:14px}
.banner.err{border-color:var(--neg);color:var(--neg)}
.loading{padding:48px 0;display:flex;flex-direction:column;gap:8px}
.loading h2{font-family:var(--f-disp);font-stretch:112%;font-size:26px}
.sk{height:120px;border-radius:22px;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.sk{animation:shim 1.4s linear infinite}@keyframes shim{to{background-position:-200% 0}}}

/* Plano (hero) */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:var(--on-plano);
  background-color:var(--plano);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(160deg,var(--plano),var(--plano-2));
  background-size:22px 22px,22px 22px,100% 100%;display:flex;flex-direction:column;gap:14px;isolation:isolate}
.hero .plan{position:absolute;right:-8px;top:-6px;width:170px;height:auto;opacity:.22;z-index:-1;pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.72)}
.hn{font-size:clamp(44px,12vw,76px)}
.hn.neg .cur+*{}
.hrow{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:rgba(255,255,255,.8)}
.hrow>span{display:inline-flex;align-items:center;gap:6px}
.hrow b{font-size:19px;color:#fff}
.hrow .dot{background:#fff}
.hchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff}
.lchart{width:100%;height:auto;display:block;color:#fff;overflow:visible}
.lchart.lc-w{display:none}
@media (min-width:900px){.lchart.lc-n{display:none}.lchart.lc-w{display:block}}
.hfoot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:rgba(255,255,255,.75);flex-wrap:wrap}
.cota{position:relative;height:13px;border-left:1.5px solid rgba(255,255,255,.75);border-right:1.5px solid rgba(255,255,255,.75)}
.cota::before{content:"";position:absolute;left:0;right:0;top:6px;border-top:1px dashed rgba(255,255,255,.4)}
.cota i{position:absolute;left:0;top:5px;height:3px;border-radius:2px;background:#fff;display:block}
.cota i::after{content:"";position:absolute;right:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff}
.hero .mbar strong{color:#fff}
.hero .iconbtn{color:#fff;background:rgba(255,255,255,.12)}
.hero .iconbtn:hover{background:rgba(255,255,255,.22);color:#fff}
.hero .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.home-top{display:grid;grid-template-columns:1fr;gap:16px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:1080px){.home-top{grid-template-columns:1.3fr 1fr;grid-template-areas:'hero side' 'tiles side';align-items:start}.home-top>.hero{grid-area:hero}.home-top>.side{grid-area:side}.home-top>.tiles{grid-area:tiles}}

/* Fichas de secciones */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{--sc:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;min-height:118px;justify-content:space-between;text-decoration:none}
.tile .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.tile .tv{font-family:var(--f-disp);font-stretch:112%;font-weight:700;letter-spacing:-.025em;font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .th{display:flex;justify-content:space-between;align-items:flex-start}
.tile .th small{font-size:12px;font-weight:600;color:var(--muted)}

/* Barra de carga hablando */
.cmd{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:7px 7px 7px 15px;box-shadow:var(--shadow)}
.cmd:focus-within{border-color:var(--accent)}
.cmd>.ic{color:var(--accent)}
.cmd input{flex:1;border:0;background:transparent;min-width:0;padding:8px 0}
.cmd input:focus{outline:none}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);padding:12px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.thinking i{animation:blink 1s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}}
.acc{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc input{margin-top:4px;width:16px;height:16px;accent-color:var(--ink);flex:none}
.acc .txt{flex:1;min-width:0}
.answer{white-space:pre-line;line-height:1.55}

/* Avisos */
.alerts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden}
.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;width:100%;color:var(--ink)}
.alert:last-child{border-bottom:0}
.alert:hover{background:var(--sunk)}
.alert .b{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.alert.neg .b{background:var(--neg-soft);color:var(--neg)} .alert.warn .b{background:var(--warn-soft);color:var(--warn)} .alert.info .b{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.alert .t{flex:1;min-width:0}
.alert>.ic{color:var(--faint)}

/* Segmentos y chips */
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;align-self:flex-start;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg>button,.seg label span{display:block;padding:6px 13px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;cursor:pointer;transition:background .2s,color .2s}
.seg label{position:relative}
.seg>.on,.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip b{font-weight:600;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.chip .x{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;color:var(--faint)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1;min-width:160px}
.inp{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.inp{resize:vertical;line-height:1.5}
.mbar{display:flex;align-items:center;gap:4px}
.mbar strong{font-weight:600;font-size:16px;min-width:140px;text-align:center;letter-spacing:-.01em}

/* Encabezados de sección */
.vhead{--sc:var(--accent);display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px}
.vhead .vh-t{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.vhead .vh-n{font-size:clamp(34px,8vw,50px);color:var(--ink)}
.vhead .vh-n small{font-size:.42em;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.vhead .vh-s{font-size:13.5px;color:var(--muted)}
.ringw{position:relative;width:112px;height:112px;flex:none}
.ringw .ring{width:100%;height:100%}
.ringw .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringw .rc b{font-size:24px}
.ringw .rc small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.ringw.lg{width:150px;height:150px}.ringw.lg .rc b{font-size:32px}

/* Tareas */
.chk{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--faint);display:grid;place-items:center;color:var(--on-ink);flex:none}
.task.p-alta .chk{border-color:var(--neg)}
.task.done .chk{background:var(--ink);border-color:var(--ink)}
.task.done .rt{text-decoration:line-through;color:var(--muted)}
.qadd{display:flex;gap:8px}
.qadd .inp{flex:1}

/* Plata */
.mov .rb{flex-direction:row;align-items:center;gap:12px;width:100%}
.mov .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.cico{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:13px;background:color-mix(in srgb,var(--cc) 15%,transparent);color:var(--cc)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.amt{white-space:nowrap;font-family:var(--f-disp);font-stretch:108%;font-size:16px;font-weight:600;letter-spacing:-.015em}
.amt .cur{vertical-align:.3em}
.dayh{font-size:12.5px;font-weight:600;color:var(--muted);padding:16px 0 2px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.06em}
.fij{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.fij .acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:560px){.fij{grid-template-columns:1fr}.fij .acts{justify-content:space-between}}
.foot{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);padding-top:2px;flex-wrap:wrap}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px 16px}
.rate>span{display:block;font-size:12px;color:var(--muted)}
.rate b{font-family:var(--f-disp);font-stretch:112%;font-weight:700;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rate small{display:block;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.rate.ref b{color:var(--accent)}
.tcard{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.tcard:last-child{border-bottom:0}
.tline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.tline b{font-family:var(--f-disp);font-stretch:110%;font-size:19px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.split i{display:block;height:100%}

/* Gráficos */
.donut{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
@media (max-width:520px){.donut{grid-template-columns:1fr;justify-items:center}}
.donut svg{width:150px;height:150px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;width:100%;min-width:0}
.legend li{display:grid;grid-template-columns:8px 1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.legend .bar{grid-column:2/4}
.bar{height:5px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--ink)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--neg)} .bar i.ok{background:var(--pos)}
.bar.big{height:10px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f);font-size:11px;fill:var(--muted)}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.hm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hm .wd{font-size:11px;color:var(--faint);text-align:center;font-weight:500}
.hm i{aspect-ratio:1;border-radius:8px;background:var(--sunk);display:block}
.hm i.l1{background:color-mix(in srgb,var(--accent) 22%,var(--sunk))}
.hm i.l2{background:color-mix(in srgb,var(--accent) 45%,var(--sunk))}
.hm i.l3{background:color-mix(in srgb,var(--accent) 70%,var(--sunk))}
.hm i.l4{background:var(--accent)}
.hm i.hoy{outline:2px solid var(--ink);outline-offset:1px}
.hm i.fut{opacity:.45}
.hml{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.hml i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
tr.cur td{background:var(--sunk);font-weight:600}
tr.tot td{font-weight:600;border-bottom:0}
.bud{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .bar{grid-column:1/3}
.bud .inp{padding:7px 10px;text-align:right}
.big-n{font-family:var(--f-disp);font-stretch:112%;font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.stack{display:flex;flex-direction:column;gap:6px}
.mono-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.mono-wrap .stack{flex:1;min-width:200px}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}

/* Notas */
.notes{columns:3 250px;column-gap:12px}
.note{break-inside:avoid;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;padding:15px 16px;border-radius:18px;margin-bottom:12px;border:1px solid var(--line);background:var(--n-none)}
.note.c-amber{background:var(--n-amber);border-color:transparent} .note.c-green{background:var(--n-green);border-color:transparent} .note.c-blue{background:var(--n-blue);border-color:transparent} .note.c-rose{background:var(--n-rose);border-color:transparent}
.note h4{font-size:15.5px;display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.note p{white-space:pre-line;overflow-wrap:anywhere;font-size:14px;max-height:13.5em;overflow:hidden;color:var(--muted)}
.note small{color:var(--faint);font-size:12px}

/* Agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{font-size:11.5px;font-weight:500;color:var(--faint);text-align:center;padding-bottom:4px}
.cd{min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:4px;min-width:0}
.cd:hover{background:var(--sunk)}
.cd .cn{font-size:13.5px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.cd.today .cn{color:var(--accent);font-weight:700}
.cd.sel .cn{background:var(--plano);color:#fff}
.dots{display:flex;gap:3px;min-height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.d-ev{background:var(--c-agenda)} .d-tk{background:var(--c-tareas)} .d-fj{background:var(--neg)}
.cl{display:none;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
@media (min-width:900px){.cd{min-height:76px}.cl{display:block}}
.evt{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;flex:none;border-radius:13px;background:color-mix(in srgb,var(--c-agenda) 13%,transparent);color:var(--c-agenda);padding:6px 0;line-height:1.1}
.evt b{font-family:var(--f-disp);font-stretch:110%;font-size:19px}
.evt small{font-size:11px;font-weight:600;text-transform:uppercase}
.evt i{font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}

/* Auto */
.veh{display:flex;flex-direction:column;gap:14px}
.veh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.veh-h h3{font-family:var(--f-disp);font-stretch:112%;font-size:22px}
.plate{font-family:var(--f-mono);font-size:12.5px;border:1.5px solid var(--ink);border-radius:6px;padding:1px 8px;font-weight:500}

/* Bóveda */
.vault-lock{max-width:420px;display:flex;flex-direction:column;gap:12px;padding:8px 0}
.vault-lock form{display:flex;flex-direction:column;gap:10px}
.kc{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.kc:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--muted)}
.kc .acts{display:flex;gap:2px}
.kc .pw{font-family:var(--f-mono);font-size:13px;letter-spacing:.02em;overflow-wrap:anywhere;color:var(--muted)}

/* Ajustes */
.set{display:flex;flex-direction:column;gap:10px}
.set form{display:flex;gap:8px;max-width:420px}

/* Plata por cuenta */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.prow:last-child{border-bottom:0}
.pico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c-plata) 13%,transparent);color:var(--c-plata);flex:none}
.prow.tj .pico{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
.pn{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.pv{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pv b{font-family:var(--f-disp);font-stretch:110%;font-weight:700;font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv b .cur{vertical-align:.35em}
.pv b.usd{color:var(--pos)}
.pv b.neg{color:var(--neg)}
.ptot{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.ptot>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.ptot .usd{color:var(--pos)}
.ptot+.stack{margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}

/* Resumen mensual */
.ins{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden}
.ins li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14.5px;list-style:none}
.ins li:last-child{border-bottom:0}
.ins ul{margin:0;padding:0}
.ins .b{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.ins .good .b{background:var(--pos-soft);color:var(--pos)} .ins .bad .b{background:var(--neg-soft);color:var(--neg)} .ins .info .b{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.cmp{display:flex;flex-direction:column}
.cr{display:flex;flex-direction:column;gap:7px;padding:9px 0;border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:0}
.ct{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px}
.ct .num{font-family:var(--f-disp);font-stretch:108%;font-weight:600;font-variant-numeric:tabular-nums}
.cb{position:relative;height:8px;background:var(--sunk);border-radius:6px}
.cb i{display:block;height:100%;border-radius:6px;min-width:2px}
.cb b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.dl{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.dl.up{background:var(--neg-soft);color:var(--neg)} .dl.down{background:var(--pos-soft);color:var(--pos)} .dl.inc{background:var(--pos-soft);color:var(--pos)}
.flow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;font-size:14px}
.flow b{font-family:var(--f-disp);font-stretch:110%;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.flow .arrow{color:var(--faint);text-align:center}
.top5 .amt{font-size:15px}

/* Obras y negocios */
.fsplit{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0 6px}
.fsplit>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.fcard{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.fh{display:flex;align-items:flex-start;gap:12px}
.fv{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--f-disp);font-stretch:112%;font-weight:700;letter-spacing:-.02em;font-size:19px;white-space:nowrap}
.fv .usd{font-size:15px}
.fk{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.fk b{color:var(--ink);font-weight:600}.fk b.pos{color:var(--pos)}.fk b.neg{color:var(--neg)}
.seg.fseg{display:flex;width:100%}
.seg.fseg label{flex:1}
.seg.fseg label span{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;font-size:14.5px}
.seg.fseg input[value=obra]:checked+span{background:var(--c-plata);color:#fff}
.fsplit .eyebrow{display:inline-flex;align-items:center;gap:5px}
.tag.fz{background:color-mix(in srgb,var(--c-plata) 16%,var(--sunk));color:var(--ink)}
.tag.gan{background:var(--pos-soft,color-mix(in srgb,var(--pos) 16%,transparent));color:var(--pos)}
.pico.obra{color:var(--c-plata)}
/* Hábitos */
.hab{gap:10px}
.hchk{width:34px;height:34px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;flex:none;color:#fff;transition:background .2s,border-color .2s,transform .15s}
.hchk:active{transform:scale(.92)}
.hchk.si{background:var(--pos);border-color:var(--pos)}
.hchk.no{border-color:var(--neg);color:var(--neg);background:color-mix(in srgb,var(--neg) 10%,transparent)}
.hchk:disabled{opacity:.4}
.hweek{display:flex;gap:4px;flex:none}
.hweek i{width:9px;height:9px;border-radius:3px;background:var(--sunk)}
.hweek i.si{background:var(--pos)}
.hweek i.no{background:color-mix(in srgb,var(--neg) 55%,var(--sunk))}
.hweek i.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.racha{color:var(--pos);font-weight:600}
.hprog{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.hprog b{color:var(--ink)}
.d-hb{background:var(--pos)}
.wks{display:flex;flex-wrap:wrap;gap:6px}
.wk input{position:absolute;opacity:0;pointer-events:none}
.wk span{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:7px 10px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
.wk input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.wk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:380px){.hweek{display:none}}

/* Documentos */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.dtile{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sunk);text-align:left;min-height:132px;min-width:0}
.dtile img{width:100%;height:92px;object-fit:cover;display:block;background:var(--sunk)}
.dtile img.err{opacity:0}
.dpdf{height:92px;display:grid;place-items:center;align-content:center;gap:4px;color:var(--c-papeles)}
.dpdf b{font-size:12px}
.dpdf.big{height:170px}
.dl2{display:flex;flex-direction:column;padding:8px 10px;gap:1px;background:var(--surface);flex:1;min-width:0}
.dl2 b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl2 small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl2 small.vencido{color:var(--neg)} .dl2 small.pronto{color:var(--warn)}
.dadd{align-items:center;justify-content:center;gap:6px;color:var(--muted);border-style:dashed;background:transparent;font-size:13px;font-weight:500;text-align:center;padding:10px}
.dview{border-radius:16px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;min-height:120px}
.dview img{max-width:100%;max-height:58vh;object-fit:contain;display:block}
.toast{display:flex;align-items:center;gap:14px}
.tbtn{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;padding:0 2px;cursor:pointer}

/* Hoja y aviso */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,7,12,.48);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;border:1px solid var(--line);
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;padding:24px}.sheet::before{display:none}}
.sheet h2{font-family:var(--f-disp);font-stretch:112%;font-size:22px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sheet form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12.5px;font-weight:500;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-family:var(--f-disp);font-stretch:112%;font-size:26px;font-weight:700;letter-spacing:-.02em}
.sacts{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.sacts .sp{flex:1}
.ferr{color:var(--neg);font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.menu{grid-template-columns:repeat(3,1fr)}}
.menu button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:16px;border:1px solid var(--line);font-weight:500;font-size:13.5px}
.menu button .ic{color:var(--sc,var(--ink))}
.menu button:hover{background:var(--sunk)}
.menu .wide{grid-column:1/-1;flex-direction:row;justify-content:center;padding:13px;background:var(--plano);color:var(--on-plano);border-color:transparent}
.menu .wide .ic{color:var(--on-plano)}
.menu .wide:hover{background:var(--plano-2)}
.sw{display:flex;gap:8px}
.sw label{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0}
.sw input:checked+i{position:absolute;inset:-4px;border:2px solid var(--ink);border-radius:50%}
.ckl{display:flex;align-items:center;gap:8px;font-size:14px}
.ckl input{width:16px;height:16px;accent-color:var(--ink)}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:calc(32px + env(safe-area-inset-bottom,0px))}}

/* Sitio propio */
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
img{max-width:100%}
.login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:auto;color:#fff;
  padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background-color:#17299A;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(160deg,#1B31B8,#0E1F78);background-size:26px 26px,26px 26px,100% 100%}
.login-box{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.login-box img{width:84px;height:84px;border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.login-box h1{font-family:var(--f-disp);font-stretch:118%;font-weight:700;font-size:32px;letter-spacing:-.03em;margin:0}
.login-box form{width:100%;display:flex;flex-direction:column;gap:10px;background:var(--surface);color:var(--ink);padding:20px;border-radius:22px;text-align:left;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.login-box .btn.pri{background:#17299A;border-color:#17299A;color:#fff;padding:12px}
.login-box .login-note{font-size:13px;opacity:.75;margin:0}
.brand img{width:28px;height:28px;border-radius:8px;display:block}
</style>

function newId(col){try{if(db)return db.collection(col).doc().id}catch(e){}return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function localPut(col,id,data){if(col==='config'){S.cfg=mergeCfg(data);return}if(col==='boveda'){S.vdoc=data;S.vloaded=true;return}if(col==='cotiz'){S.cotiz=data;return}const a=S[col];const i=a.findIndex(x=>x.id===id);const r={id,...data};if(i>=0)a[i]=r;else a.push(r)}
async function put(col,id,data){
  if(!db){localPut(col,id,data);render();return true}
  pend++;renderSync();
  try{await db.collection(col).doc(id).set(data);syncErr=false;return true}
  catch(e){fail(e);return false}
  finally{pend--;renderSync()}
}
async function del(col,id){
  if(!db){S[col]=S[col].filter(x=>x.id!==id);render();return}
  pend++;renderSync();
  try{await db.collection(col).doc(id).delete();syncErr=false}catch(e){fail(e)}finally{pend--;renderSync()}
}
function fail(e){syncErr=true;const c=e&&e.code;
  toast(c==='quota_exceeded'?'La libreta llegó a su límite de registros. Borrá datos viejos o exportá un respaldo.':
        c==='invalid_argument'?'Solo el dueño de esta libreta puede guardar cambios.':'No se pudo guardar. Revisá la conexión y probá de nuevo.')}
const mergeCfg=c=>({...DEF,...c,presupuestos:{...(c.presupuestos||{})},fiscal:{...DEF.fiscal,...(c.fiscal||{})},fondos:Array.isArray(c.fondos)?c.fondos:[],tarjetas:{...(c.tarjetas||{})},monoTabla:(c.monoTabla&&c.monoTabla.cats&&c.monoTabla.cats.length)?c.monoTabla:MONO_DEF});
const putCfg=()=>put('config','main',{...S.cfg});
function renderSync(){
  const el=$('#sync');if(!el)return;let k='ok',t='Sincronizado';
  if(S.booting){k='idle';t='Conectando…'}
  else if(!db){k='idle';t='Sin nube'}
  else if((window.OUTBOX_N||0)>0){k=navigator.onLine?'saving':'off';t=navigator.onLine?'Subiendo cambios…':`Sin internet · ${window.OUTBOX_N} sin subir`}
  else if(!navigator.onLine){k='off';t='Sin internet · todo guardado'}
  else if(pend>0){k='saving';t='Guardando…'}
  else if(syncErr){k='err';t='No se guardó'}
  el.className='sync '+k;el.lastElementChild.textContent=t;
}

const DSEM=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function habToca(hb,d){if(!d||(hb.desde&&d<hb.desde))return false;const f=hb.frec||'diario';
  if(f==='dias')return(hb.dias||[]).includes(parseD(d).getDay());
  if(f==='cada'){const n=Math.max(1,+hb.cada||1);const k=Math.round((parseD(d)-parseD(hb.desde||d))/864e5);return k>=0&&k%n===0}
  return true}
const habEst=(hb,d)=>{const v=(hb.hechos||{})[d];return v===1||v===true?'si':v===0||v===false?'no':''};
function habRacha(hb){let d=HOY(),n=0;if(habToca(hb,d)&&habEst(hb,d)!=='si')d=addDays(d,-1);
  for(let i=0;i<500;i++){if(hb.desde&&d<hb.desde)break;if(habToca(hb,d)){if(habEst(hb,d)==='si')n++;else break}d=addDays(d,-1)}return n}
function habPct(hb,dias){dias=dias||30;let t=0,s=0,d=HOY();if(habToca(hb,d)&&!habEst(hb,d))d=addDays(d,-1);
  for(let i=0;i<dias;i++){if(hb.desde&&d<hb.desde)break;if(habToca(hb,d)){t++;if(habEst(hb,d)==='si')s++}d=addDays(d,-1)}return t?s/t:null}
const habFrecTxt=hb=>hb.frec==='dias'?((hb.dias||[]).length===7?'Todos los días':[1,2,3,4,5,6,0].filter(i=>(hb.dias||[]).includes(i)).map(i=>DSEM[i]).join(' · ')):hb.frec==='cada'?`Cada ${hb.cada||2} días`:'Todos los días';

function tot(list,mon){mon=mon||'ARS';let ing=0,gas=0;list.forEach(x=>{if((x.moneda||'ARS')!==mon)return;if(x.tipo==='ingreso')ing+=+x.monto||0;else if(x.tipo==='gasto')gas+=+x.monto||0});return{ing,gas,saldo:ing-gas}}

/* Dólar */
const rateOf=k=>{const r=S.cotiz&&S.cotiz[k];if(!r)return 0;const c=+r.compra||0,v=+r.venta||0;return c&&v?(c+v)/2:(v||c)};

function fijoEstado(f,m){
  if(f.pagados&&f.pagados[m])return{k:'pagado',t:f.debito?'Debitado':'Pagado'};

}

/* Tarjetas */
function ciclo(nombre,ref){
  const t=S.cfg.tarjetas[nombre];ref=ref||HOY();
  const cIn=ym=>ym+'-'+pad(Math.min(+t.cierre||1,dim(ym)));
  let ym=ref.slice(0,7),c=cIn(ym);if(ref>c){ym=addM(ym,1);c=cIn(ym)}
  const prev=cIn(addM(ym,-1)),prev2=cIn(addM(ym,-2));
  const vOf=cd=>{const cy=cd.slice(0,7);const vy=(+t.vence>+t.cierre)?cy:addM(cy,1);return vy+'-'+pad(Math.min(+t.vence||1,dim(vy)))};
  const suma=(a,b)=>{let ars=0,usd=0;S.movs.forEach(x=>{if(x.cuenta!==nombre||x.tipo!=='gasto')return;const f=x.fecha||'';if(f>a&&f<=b){if((x.moneda||'ARS')==='USD')usd+=+x.monto||0;else ars+=+x.monto||0}});return{ars,usd}};
  const pagMov=(t.pagados||{})[prev.slice(0,7)];
  return{t,cierre:c,prev,actual:suma(prev,c),anterior:suma(prev2,prev),venceAnt:vOf(prev),venceAct:vOf(c),pagadoAnt:!!pagMov};
}
function comprometido(nmeses){const h=HOY(),out=[];const base=h.slice(0,7);

    out.push({ym,v:ls.filter(x=>(x.moneda||'ARS')!=='USD').reduce((s,x)=>s+(+x.monto||0),0),u:ls.filter(x=>x.moneda==='USD').reduce((s,x)=>s+(+x.monto||0),0)})}
  return out}

function proxService(v){const ss=S.servicios.filter(s=>s.vehiculo===v.id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));

const tabla=()=>S.cfg.monoTabla.cats;

function factEntre(desde,hasta){return emitidas().filter(f=>f.fecha>=desde&&f.fecha<=hasta).reduce((s,f)=>s+(+f.total||0),0)}
function catPara(monto){return tabla().find(x=>monto<=x.tope)||null}
function proxRecat(){const h=HOY(),y=+h.slice(0,4);
  const feb=y+'-02-05',ago=y+'-08-05';
  if(h<=feb)return{limite:feb,desde:(y-1)+'-01-01',hasta:(y-1)+'-12-31'};
  if(h<=ago)return{limite:ago,desde:(y-1)+'-07-01',hasta:y+'-06-30'};
  return{limite:(y+1)+'-02-05',desde:y+'-01-01',hasta:y+'-12-31'}}
function monoEstado(){
  const F=S.cfg.fiscal,ci=catInfo(F.categoria),h=HOY(),m=h.slice(0,7);
  const desde=addM(m,-11)+'-01',fact12=factEntre(desde,h);
  const queda=ci.tope-fact12,pct=fact12/ci.tope;
  const ult3=[1,2,3].map(k=>{const mm=addM(m,-k);return factEntre(mm+'-01',mm+'-31')});
  const prom=ult3.reduce((a,b)=>a+b,0)/3;
  const rc=proxRecat();const factRc=factEntre(rc.desde,rc.hasta>h?h:rc.hasta);
  const cuota=F.actividad==='bien'?ci.bien:ci.serv;
  return{F,ci,fact12,queda,pct,prom,meses:prom>0?queda/prom:null,rc,factRc,catRc:catPara(factRc),cuota};
}

  S.turnos.filter(e=>e.fecha===h).sort(byEv).forEach(e=>out.push({k:'info',t:`Hoy${e.hora?' a las '+e.hora:''}: ${e.titulo}`,go:'agenda'}));
  S.fijos.filter(f=>fijoAplica(f,m)).forEach(f=>{const e=fijoEstado(f,m);if(e.k==='vencido')out.push({k:'neg',t:`${f.nombre}: ${f.debito?'confirmá si se debitó':'venció sin pagar'} (${money0(f.monto)})`,go:'finanzas',ftab:'fijos'});
    else if(e.k==='pronto')out.push({k:'warn',t:`${f.nombre}: ${e.t.toLowerCase()} · ${money(f.monto,f.moneda)}${f.debito?' por débito':''}`,go:'finanzas',ftab:'fijos'})});
  Object.keys(S.cfg.tarjetas).forEach(n=>{const c=ciclo(n);const dc=diasHasta(c.cierre),dv=diasHasta(c.venceAnt);
    if(!c.pagadoAnt&&c.anterior.ars+c.anterior.usd>0&&dv<=3)out.push({k:dv<0?'neg':'warn',t:`${n}: el resumen de ${money0(c.anterior.ars)}${c.anterior.usd?' + '+usd0(c.anterior.usd):''} ${dv<0?'venció':dv===0?'vence hoy':'vence el '+fechaDia(c.venceAnt)}`,go:'finanzas',ftab:'tarj'});
    if(dc<=2)out.push({k:'info',t:`${n} cierra ${dc===0?'hoy':dc===1?'mañana':'el '+fechaDia(c.cierre)}: lo que compres después pasa al resumen siguiente`,go:'finanzas',ftab:'tarj'})});
  S.papeles.forEach(p=>{const e=papelEstado(p);if(e.k!=='ok')out.push({k:e.k==='vencido'?'neg':'warn',t:`${p.nombre}: ${e.t.toLowerCase()}`,go:'papeles'})});
  S.archivos.filter(a=>a.vence).forEach(a=>{const e=papelEstado(a);if(e.k==='ok')return;const veh=a.ref&&a.ref.col==='vehiculos'?S.vehiculos.find(v=>v.id===a.ref.id):null;
    out.push({k:e.k==='vencido'?'neg':'warn',t:`${a.nombre||'Documento'}${veh?' de '+veh.nombre:''}: ${e.t.toLowerCase()}`,go:veh?'auto':'papeles'})});
  S.vehiculos.forEach(v=>{const ps=proxService(v);if(ps&&ps.urg!=='ok')out.push({k:ps.urg==='vencido'?'neg':'warn',t:`${v.nombre}: ${ps.s.tipo||'service'} ${ps.urg==='vencido'?'atrasado':'cerca'}${ps.faltaKm!=null?` (${ps.faltaKm<=0?'te pasaste '+nf0.format(-ps.faltaKm):'faltan '+nf0.format(ps.faltaKm)} km)`:''}`,go:'auto'})});
  if(S.cfg.fiscal.regimen==='mono'){
    const me=monoEstado();
    if(me.pct>=1)out.push({k:'neg',t:`Te pasaste del tope de la categoría ${me.ci.c} en los últimos 12 meses`,go:'impuestos'});

function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart(labels,series,opts){
  opts=opts||{};const all=series.flatMap(s=>s.vals);const dataMax=Math.max(...all);
  if(!dataMax)return null;
  const mx=Math.max(dataMax,opts.ref||0);
  const n=labels.length,top=niceMax(mx),W=560,H=200,pl=52,pr=6,pt=16,pb=24,cw=(W-pl-pr)/n,ns=series.length,bw=Math.min(18,cw/(ns+1.6)),ih=H-pt-pb;
  const y=v=>pt+ih-(v/top)*ih;
  let s='';[0,.5,1].forEach(t=>{const yy=y(top*t);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${compact(top*t)}</text>`});
  labels.forEach((lb,i)=>{const cx=pl+cw*i+cw/2;const hl=opts.hl!=null?i===opts.hl:i===n-1;
    series.forEach((se,j)=>{const v=se.vals[i];const x=cx-(ns*bw+(ns-1)*2)/2+j*(bw+2);
      s+=`<rect class="b" style="animation-delay:${i*45+j*20}ms" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(ih-(y(v)-pt),0)}" rx="3" fill="${se.color}" opacity="${hl?1:.55}"><title>${esc(se.name)} ${esc(opts.titles?opts.titles[i]:lb)}: ${money0(v)}</title></rect>`});
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" style="${hl?'fill:var(--ink);font-weight:600':''}">${esc(lb)}</text>`});
  if(opts.ref){const yy=y(opts.ref);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--neg)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${pl+6}" y="${yy-6}" text-anchor="start" style="fill:var(--neg);paint-order:stroke;stroke:var(--surface);stroke-width:4px;font-weight:600">${esc(opts.refLabel||'')}</text>`}
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Gráfico de barras')}">${s}</svg>`;
}

function lineMes(m,W,H,cls){W=W||320;H=H||86;
  const h=HOY(),n=dim(m),esHoy=m===h.slice(0,7),dd=esHoy?+h.slice(8):(m<h.slice(0,7)?n:0);
  const prev=addM(m,-1),np=dim(prev);
  const acum=(ym,len)=>{const a=new Array(len).fill(0);movsMes(ym).forEach(x=>{if(x.tipo==='gasto'&&(x.moneda||'ARS')==='ARS'){const i=+String(x.fecha).slice(8)-1;if(i>=0&&i<len)a[i]+=+x.monto||0}});let s=0;return a.map(v=>s+=v)};
  const cur=acum(m,n).slice(0,dd),pv=acum(prev,np);
  const last=cur.length?cur[cur.length-1]:0,proy=esHoy&&dd>0?last/dd*n:last;
  const prevSame=dd>0?(pv[Math.min(dd,np)-1]||0):0;
  const mx=Math.max(proy,pv[np-1]||0,1);
  const x=i=>i/(n-1)*W,y=v=>H-5-(v/mx)*(H-16);

  if(pv.some(v=>v))s+=`<polyline points="${pts(pv.slice(0,n))}" fill="none" stroke="currentColor" stroke-opacity=".42" stroke-width="1.5" stroke-dasharray="3 4"/>`;
  if(cur.length>1){s+=`<polygon class="area" points="0,${H-5} ${pts(cur)} ${x(cur.length-1).toFixed(1)},${H-5}" fill="currentColor" fill-opacity=".14"/>`;s+=`<polyline class="ln" pathLength="1" points="${pts(cur)}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`}
  if(esHoy&&dd>0&&dd<n&&last>0)s+=`<line x1="${x(dd-1).toFixed(1)}" y1="${y(last).toFixed(1)}" x2="${W}" y2="${y(proy).toFixed(1)}" stroke="currentColor" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="1 5" stroke-linecap="round"/>`;
  if(dd>0){const cx=x(dd-1).toFixed(1),cy=y(last).toFixed(1);s+=`<circle class="pulse" cx="${cx}" cy="${cy}" r="8" fill="currentColor" fill-opacity=".35"/><circle cx="${cx}" cy="${cy}" r="4.5" fill="currentColor"/>`}

async function prepararArchivo(file){
  const t=(file.type||'').toLowerCase(),n=(file.name||'').toLowerCase();
  if(t==='application/pdf'||/\.pdf$/.test(n))return{blob:file,type:'application/pdf',ext:'pdf'};
  if(/^image\//.test(t)||/\.(jpe?g|png|webp|heic|heif|gif)$/.test(n)){
    try{const bmp=await createImageBitmap(file);const mx=2000,sc=Math.min(1,mx/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(b)return{blob:b,type:'image/jpeg',ext:'jpg'}}catch(e){}
    if(/^image\/(png|jpeg|webp|gif)$/.test(t))return{blob:file,type:t,ext:t.split('/')[1].replace('jpeg','jpg')};
  }
  throw{code:'tipo'};
}

const mesResumenDef=()=>{const h=HOY();return +h.slice(8)<=5?addM(h.slice(0,7),-1):h.slice(0,7)};

  const cg=grp(g,'categoria'),cgp=grp(gp,'categoria'),ci=grp(i,'categoria'),cc=grp(g,'cuenta');
  const prevs=[1,2,3,4,5,6].map(k=>tot(movsMes(addM(m,-k)))).filter(x=>x.ing||x.gas);

  const ini=caja(finP),fin=caja(enCurso?h:finM);

  const P=S.cfg.presupuestos||{},excedidos=Object.keys(P).filter(c=>+P[c]&&(cg[c]||0)>+P[c]);
  return{m,prev,enCurso,t,tp,tu,cg,cgp,ci,cc,avgG,dias,ini,fin,fijos,fijosOk,excedidos,P,
    top:g.slice().sort((a,b)=>(+b.monto||0)-(+a.monto||0)).slice(0,5),
    nMov:mv.filter(x=>x.tipo==='gasto'||x.tipo==='ingreso').length,

function conclusiones(D){
  const out=[],pm=mesNombre(D.prev);
  if(D.t.ing>0){const r=D.t.saldo/D.t.ing;out.push(r>=0?{k:'good',i:'trendup',t:`Te quedó el ${Math.round(r*100)}% de lo que entró: ${money0(D.t.saldo)}.`}:{k:'bad',i:'trenddn',t:`Gastaste ${money0(-D.t.saldo)} más de lo que entró en el mes.`})}
  else if(D.t.gas>0)out.push({k:'info',i:'spark',t:`No cargaste ingresos en pesos este mes; los gastos suman ${money0(D.t.gas)}.`});
  if(D.tp.gas>0&&D.t.gas>0){const d=D.t.gas/D.tp.gas-1;if(Math.abs(d)>=.01)out.push({k:d>0?'bad':'good',i:d>0?'trendup':'trenddn',t:`Gastaste ${Math.abs(Math.round(d*100))}% ${d>0?'más':'menos'} que en ${pm} (${d>0?'+':'−'}${money0(Math.abs(D.t.gas-D.tp.gas)).replace('− ','')})${D.enCurso?', y el mes todavía no terminó':''}.`})}
  if(D.avgG&&D.t.gas>0&&!D.enCurso){const d=D.t.gas/D.avgG-1;if(Math.abs(d)>=.05)out.push({k:d>0?'bad':'good',i:'chart',t:`Contra tu promedio de los meses anteriores (${money0(D.avgG)}), gastaste ${Math.abs(Math.round(d*100))}% ${d>0?'más':'menos'}.`})}
  const cats=[...new Set([...Object.keys(D.cg),...Object.keys(D.cgp)])].map(c=>({c,d:(D.cg[c]||0)-(D.cgp[c]||0)}));
  const up=cats.filter(x=>x.d>0).sort((a,b)=>b.d-a.d)[0],dn=cats.filter(x=>x.d<0).sort((a,b)=>a.d-b.d)[0];
  if(D.tp.gas>0&&up)out.push({k:'bad',i:'trendup',t:`Lo que más subió: ${up.c}, ${money0(up.d)} más que en ${pm}.`});
  if(D.tp.gas>0&&dn)out.push({k:'good',i:'trenddn',t:`Lo que más bajó: ${dn.c}, ${money0(-dn.d)} menos que en ${pm}.`});
  if(D.excedidos.length)out.push({k:'bad',i:'alert',t:`Te pasaste del tope en ${D.excedidos.join(', ')}.`});
  if(D.fijos.length)out.push({k:D.fijosOk===D.fijos.length?'good':'info',i:'rep',t:`Pagos fijos: ${D.fijosOk} de ${D.fijos.length} marcados como pagados.`});
  if(D.tu.ing||D.tu.gas)out.push({k:'info',i:'wallet',t:`En dólares: entraron ${usd0(D.tu.ing)} y salieron ${usd0(D.tu.gas)}. Se cuentan aparte.`});
  return out.slice(0,7);
}

const habDia=ds=>{if(ds>HOY())return false;const t=habsDe(ds);return t.length>0&&t.every(h=>habEst(h,ds)==='si')};
V.agenda=()=>{
  const m=S.calMes,first=parseD(m+'-01'),off=(first.getDay()+6)%7,n=dim(m),h=HOY();
  let cells=['L','M','M','J','V','S','D'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<off;i++)cells+='<div></div>';
  for(let d=1;d<=n;d++){const ds=m+'-'+pad(d);const ev=S.turnos.filter(x=>x.fecha===ds).sort(byEv);const tk=S.tareas.some(x=>x.fecha===ds&&!x.hecha);
    const fj=S.fijos.some(f=>fijoAplica(f,m)&&fijoDue(f,m)===ds&&!(f.pagados||{})[m])||S.papeles.some(p=>p.vence===ds);
    cells+=`<button class="cd ${ds===h?'today':''} ${ds===S.calDia?'sel':''}" data-act="calday" data-d="${ds}" aria-label="${fechaLarga(ds)}"><span class="cn">${d}</span><span class="dots">${ev.length?'<i class="d-ev"></i>':''}${tk?'<i class="d-tk"></i>':''}${fj?'<i class="d-fj"></i>':''}${habDia(ds)?'<i class="d-hb"></i>':''}</span>${ev.length?`<span class="cl">${esc((ev[0].hora?ev[0].hora+' ':'')+ev[0].titulo)}</span>`:''}</button>`}
  const sd=S.calDia,sm=sd.slice(0,7);
  const dEv=S.turnos.filter(x=>x.fecha===sd).sort(byEv),dTk=S.tareas.filter(x=>x.fecha===sd).sort(byTask),dFj=S.fijos.filter(f=>fijoAplica(f,sm)&&fijoDue(f,sm)===sd),dPa=S.papeles.filter(p=>p.vence===sd);
  const prox=S.turnos.filter(x=>x.fecha>=h&&x.fecha<=addDays(h,30)).sort(byEv);
  const nx=S.turnos.filter(x=>x.fecha>=h).sort(byEv)[0],sem=S.turnos.filter(x=>x.fecha>=h&&x.fecha<=addDays(h,7)).length;

  return`${exBanner()}${head}<div class="toolbar">${monthbar('calMes')}<div class="lg" style="margin-left:auto"><span><i style="background:var(--c-agenda)"></i>Turnos</span><span><i style="background:var(--c-tareas)"></i>Tareas</span><span><i style="background:var(--neg)"></i>Vencimientos</span>${S.habitos.length?'<span><i style="background:var(--pos)"></i>Hábitos cumplidos</span>':''}</div></div>
  <div class="grid2"><article class="card"><div class="cal">${cells}</div></article>
  <article class="card"><header class="ch"><h3>${fechaLarga(sd)}</h3><button class="btn sm" data-new="turno" data-fecha="${sd}">${ic('plus',15)}Turno</button></header>
   ${dEv.length||dTk.length||dFj.length||dPa.length?`<ul class="list">${dEv.map(evRow).join('')}${dTk.map(taskRow).join('')}${dFj.map(f=>{const e=fijoEstado(f,sm);return`<li class="row"><button class="rb" data-edit="fijo" data-id="${f.id}"><span class="rt">${esc(f.nombre)}</span><span class="rm"><span class="num">${money(f.monto,f.moneda)}</span><span class="pill ${e.k}">${e.t}</span></span></button></li>`}).join('')}${dPa.map(p=>`<li class="row"><button class="rb" data-edit="papel" data-id="${p.id}"><span class="rt">Vence: ${esc(p.nombre)}</span><span class="rm"><span>${esc(p.cat||'')}</span></span></button></li>`).join('')}</ul>`:'<p class="muted">Nada agendado este día.</p>'}
   <h4 class="sub">Próximos 30 días</h4>${prox.length?`<ul class="list">${prox.map(evRow).join('')}</ul>`:'<p class="muted small">Sin turnos en el próximo mes.</p>'}</article></div>
  <div class="grid2"><article class="card" style="--sc:var(--pos)"><header class="ch"><h3><span class="ico">${ic('rep',16)}</span>Hábitos · ${fechaRel(sd)}</h3><button class="btn sm" data-new="habito">${ic('plus',15)}Hábito</button></header>${habBlock(sd)}
   ${S.habitos.length?'<p class="hint">Tocá el círculo: una vez es hecho, dos es no lo hice, tres lo deja sin marcar. Elegí otro día en el calendario para marcar días anteriores.</p>':''}</article>
   ${S.habitos.length?`<article class="card"><header class="ch"><h3>Cómo vas</h3><span class="muted small">últimos 30 días</span></header><div class="cmp">${S.habitos.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).map(h=>{const p=habPct(h,30),r=habRacha(h);return`<div class="cr"><div class="ct"><span class="dot" style="background:var(--pos)"></span><button class="lnk" data-edit="habito" data-id="${h.id}" style="display:inline;padding:0;text-align:left;justify-self:start;color:var(--ink);font-weight:500">${esc(h.nombre)}</button><span class="num">${p==null?'—':Math.round(p*100)+'%'}</span><span class="dl">${r>1?r+' seguidas':r===1?'1 vez':'sin racha'}</span></div><div class="cb"><i style="width:${p==null?0:(p*100).toFixed(1)}%;background:var(--pos)"></i></div></div>`}).join('')}</div></article>`:''}</div>`;

const enc=new TextEncoder(),decd=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function unseal(key,d){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.iv)},key,ub64(d.ct));return JSON.parse(decd.decode(pt))}

function resumenDatos(){

  out.gastosPorMesYCategoria={};out.ingresosPorMes={};
  meses.forEach(ym=>{const g={};let ing=0;movsMes(ym).forEach(x=>{if((x.moneda||'ARS')!=='ARS')return;if(x.tipo==='gasto')g[x.categoria||'Otros']=Math.round((g[x.categoria||'Otros']||0)+(+x.monto||0));else if(x.tipo==='ingreso')ing+=+x.monto||0});
    if(Object.keys(g).length)out.gastosPorMesYCategoria[ym]=g;if(ing)out.ingresosPorMes[ym]=Math.round(ing)});
  out.ultimosMovimientos=S.movs.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')).slice(0,40).map(x=>[x.fecha,x.tipo,x.monto,x.moneda||'ARS',x.categoria||'',x.cuenta||'',x.desc||'']);
  const acc=saldos();out.saldosCuentas=acc;const pt=patrimonio();out.plataPorCuenta=plataPorCuenta();
  out.dolar=S.cotiz?Object.fromEntries(DOLARES.filter(([k])=>S.cotiz[k]).map(([k])=>[k,S.cotiz[k].venta])):null;
  out.tareasPendientes=S.tareas.filter(t=>!t.hecha).sort(byTask).slice(0,40).map(t=>[t.titulo,t.fecha||'',t.lista||'']);
  out.turnosProximos=S.turnos.filter(e=>e.fecha>=h).sort(byEv).slice(0,20).map(e=>[e.titulo,e.fecha,e.hora||'',e.lugar||'']);
  out.pagosFijos=S.fijos.map(f=>[f.nombre,f.monto,f.moneda||'ARS',f.dia,f.frecuencia||'mensual',f.debito?'débito':'',(f.pagados||{})[m]?'pagado este mes':'']);
  out.tarjetas=Object.keys(S.cfg.tarjetas).map(n=>{const c=ciclo(n);return{tarjeta:n,resumenAnterior:Math.round(c.anterior.ars),vence:c.venceAnt,pagado:c.pagadoAnt,resumenEnCurso:Math.round(c.actual.ars),cierra:c.cierre}});
  out.cuotasComprometidas=comprometido(12).filter(x=>x.v).map(x=>[x.ym,Math.round(x.v)]);
  out.papeles=S.papeles.map(p=>[p.nombre,p.vence]);
  out.autos=S.vehiculos.map(v=>({auto:v.nombre,km:v.km}));
  if(S.cfg.fiscal.regimen==='mono'){const me=monoEstado();out.monotributo={categoria:me.ci.c,tope:Math.round(me.ci.tope),facturado12meses:Math.round(me.fact12),quedaPorFacturar:Math.round(me.queda),cuota:Math.round(me.cuota)}}
  return out;
}

async function correrAI(texto){
  S.ai={estado:'pensando',texto,acciones:[],respuesta:''};renderAI();

    const r=await smp.json(promptAI(texto),{cache:false,signal:aiCtl.signal,modelTier:'default',effort:'low'});
    const acc=(Array.isArray(r&&r.acciones)?r.acciones:[]).map(normAcc).filter(Boolean);
    S.ai={estado:'listo',texto,acciones:acc.map(a=>({...a,_on:true})),respuesta:String((r&&r.respuesta)||'')};
  }catch(e){
    const c=e&&e.code;if(c==='cancelled'){closeSheet();return}
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){smp=null;S.ai={estado:'error',texto,msg:'Para usar la carga hablando tenés que permitir que la libreta use Claude. Volvé a abrir la libreta y aceptá el permiso.'}}

  }
  renderAI();
}

async function crearMov(o){
  const base={tipo:o.tipo,monto:+o.monto,moneda:o.moneda||'ARS',cuenta:o.cuenta,fecha:o.fecha||HOY(),desc:o.desc||'',creado:Date.now()};if(fk(o.fondo)===FOBRA)base.fondo=FOBRA;
  if(o.tipo==='ajuste'){base.desc=o.desc||'Ajuste de saldo';return put('movs',newId('movs'),base)}
  if(o.tipo==='transf'){base.destino=o.destino;if(+o.montoDest)base.montoDest=+o.montoDest;base.monedaDest=o.monedaDest||base.moneda;if(+o.tc)base.tc=+o.tc;return put('movs',newId('movs'),base)}
  base.categoria=o.categoria;
  const n=o.tipo==='gasto'?Math.max(1,parseInt(o.cuotas)||1):1;
  if(n===1)return put('movs',newId('movs'),base);
  const g=newId('movs');let ok=true;
  for(let k=0;k<n;k++){const d={...base,fecha:addMD(base.fecha,k),desc:(base.desc||base.categoria)+` (${k+1}/${n})`,grupo:g,cuota:{n:k+1,total:n},creado:Date.now()+k};if(!(await put('movs',newId('movs'),d)))ok=false}
  return ok;
}
async function crearFactura(data,conIngreso){
  const id=newId('facturas');const d={...data,creado:Date.now()};
  if(conIngreso&&d.tipo==='emitida'){const mid=newId('movs');d.mov=mid;
    if(!(await put('facturas',id,d)))return false;
    return put('movs',mid,{tipo:'ingreso',monto:d.total,moneda:'ARS',categoria:S.cfg.catIngreso.includes('Honorarios')?'Honorarios':S.cfg.catIngreso[0],cuenta:S.cfg.cuentas.includes('Banco')?'Banco':S.cfg.cuentas[0],fecha:d.fecha,desc:'Factura '+(d.cliente||d.numero||''),factura:id,creado:Date.now()})}
  return put('facturas',id,d);
}

}

async function pagar(f,m){
  const id=newId('movs');const due=fijoDue(f,m),h=HOY();
  const fecha=m!==h.slice(0,7)?due:(f.debito&&due<=h?due:h);
  const ok=await put('movs',id,{tipo:'gasto',monto:+f.monto||0,moneda:f.moneda||'ARS',categoria:f.categoria||'Servicios',cuenta:f.cuenta||S.cfg.cuentas[0]||'',fecha,desc:f.nombre,fijo:f.id,creado:Date.now()});
  if(!ok)return;
  const b=strip(f);b.pagados={...(f.pagados||{}),[m]:id};
  if(await put('fijos',f.id,b))toast(`${f.nombre}: ${f.debito?'débito confirmado':'pagado'} y cargado en gastos`);
}
async function despagar(f,m){
  const mid=(f.pagados||{})[m];if(mid)await del('movs',mid);
  const b=strip(f);const p={...(f.pagados||{})};delete p[m];b.pagados=p;await put('fijos',f.id,b);toast('Deshecho');
}
async function pagarTarjeta(n){const c=ciclo(n);const desde=cuentaPago();
  const mid=newId('movs');const ym=c.prev.slice(0,7);
  if(c.anterior.ars>0&&!(await put('movs',mid,{tipo:'transf',monto:c.anterior.ars,moneda:'ARS',cuenta:desde,destino:n,monedaDest:'ARS',fecha:HOY(),desc:'Pago resumen '+n,creado:Date.now()})))return;
  let mid2=null;if(c.anterior.usd>0){mid2=newId('movs');await put('movs',mid2,{tipo:'transf',monto:c.anterior.usd,moneda:'USD',cuenta:desde,destino:n,monedaDest:'USD',fecha:HOY(),desc:'Pago resumen '+n+' (dólares)',creado:Date.now()})}
  const t=S.cfg.tarjetas[n];S.cfg.tarjetas={...S.cfg.tarjetas,[n]:{...t,pagados:{...(t.pagados||{}),[ym]:[c.anterior.ars>0?mid:null,mid2].filter(Boolean)}}};
  if(await putCfg())toast(`Resumen de ${n} pagado desde ${desde}`);render()}

async function toggleTarea(x){

    await put('tareas',newId('tareas'),n);toast('Hecha. La próxima queda para '+fechaRel(nx).toLowerCase());return}

function exportCSV(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Fecha','Tipo','Monto','Moneda','Categoría','Cuenta','Destino','Descripción'].join(';')];
  [...S.movs].sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).forEach(x=>rows.push([x.fecha,x.tipo==='transf'?'transferencia':x.tipo,String(x.monto).replace('.',','),x.moneda||'ARS',q(x.categoria),q(x.cuenta),q(x.destino),q(x.desc)].join(';')));
  saveFile('movimientos-'+HOY()+'.csv','﻿'+rows.join('\r\n'));
}

const rid=()=>{const a=crypto.getRandomValues(new Uint8Array(12));return Array.from(a,b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('')};
function makeDB(){
  const cache={},colL={},docL={};let loaded=false,lastLoad=0,flushing=false,saveT=null;
  const CK='libreta-datos-'+UID,OK='libreta-pendientes-'+UID;
  let outbox=[];try{outbox=JSON.parse(localStorage.getItem(OK)||'[]')||[]}catch(e){outbox=[]}
  try{const j=JSON.parse(localStorage.getItem(CK)||'null');if(j&&j.o){Object.keys(j.o).forEach(c=>cache[c]=new Map(j.o[c]));loaded=true;lastLoad=0}}catch(e){}
  window.OUTBOX_N=outbox.length;
  const m=c=>cache[c]||(cache[c]=new Map());
  const guardarCopia=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{const o={};Object.keys(cache).forEach(c=>o[c]=[...cache[c]]);localStorage.setItem(CK,JSON.stringify({ts:Date.now(),o}))}catch(e){}},300)};
  const guardarCola=()=>{try{localStorage.setItem(OK,JSON.stringify(outbox))}catch(e){}window.OUTBOX_N=outbox.length;renderSync()};
  const colSnap=c=>({docs:[...m(c)].map(([id,d])=>({id,data:()=>d})),metadata:{}});
  const docSnap=(c,id)=>{const d=m(c).get(id);return{id,exists:d!==undefined,data:()=>d,metadata:{}}};
  const emit=(c,id)=>{(colL[c]||[]).forEach(f=>f(colSnap(c)));if(id!=null)(docL[c+'/'+id]||[]).forEach(f=>f(docSnap(c,id)));guardarCopia()};
  const emitAll=()=>{Object.keys(colL).forEach(c=>(colL[c]||[]).forEach(f=>f(colSnap(c))));Object.keys(docL).forEach(p=>{const[c,id]=p.split('/');(docL[p]||[]).forEach(f=>f(docSnap(c,id)))});guardarCopia()};
  const esRed=e=>!navigator.onLine||!e||/fetch|network|load failed|timeout|offline|ERR_|50[234]/i.test(String((e&&e.message)||'')+' '+String((e&&e.code)||'')+' '+String((e&&e.status)||''));
  async function loadAll(){
    const fresh={};let from=0;const step=1000;
    for(;;){const{data,error}=await SB.from('docs').select('col,id,data').range(from,from+step-1);if(error)throw error;
      data.forEach(r=>{(fresh[r.col]||(fresh[r.col]=new Map())).set(r.id,r.data)});if(data.length<step)break;from+=step}
    outbox.forEach(it=>{const mm=fresh[it.col]||(fresh[it.col]=new Map());if(it.op==='set')mm.set(it.id,it.data);else mm.delete(it.id)});
    Object.keys(cache).forEach(c=>{if(!fresh[c])cache[c]=new Map()});Object.assign(cache,fresh);loaded=true;lastLoad=Date.now();emitAll();
  }
  async function subir(){
    if(flushing||!outbox.length||!navigator.onLine)return;flushing=true;
    try{while(outbox.length){const it=outbox[0];let res;
        try{res=it.op==='set'?await SB.from('docs').upsert({user_id:UID,col:it.col,id:it.id,data:it.data,updated_at:new Date(it.ts).toISOString()}):await SB.from('docs').delete().match({col:it.col,id:it.id})}
        catch(e){res={error:e}}
        if(res&&res.error){if(esRed(res.error))break;outbox.shift();guardarCola();toast('Un cambio no se pudo guardar en la nube y se descartó.');continue}
        outbox.shift();guardarCola()}}
    finally{flushing=false}
  }
  const encolar=(op,c,id,data)=>{outbox=outbox.filter(x=>!(x.col===c&&x.id===id));outbox.push({op,col:c,id,data,ts:Date.now()});guardarCola();subir()};
  const refrescar=()=>subir().then(()=>loadAll()).catch(()=>{});
  function live(){try{SB.channel('libreta-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      if(p.eventType==='DELETE'){const o=p.old||{};if(o.col&&o.id!=null&&!outbox.some(x=>x.col===o.col&&x.id===o.id)){m(o.col).delete(o.id);emit(o.col,o.id)}}
      else{const n=p.new||{};if(n.col&&n.id!=null&&!outbox.some(x=>x.col===n.col&&x.id===n.id)){m(n.col).set(n.id,n.data);emit(n.col,n.id)}}
    }).subscribe()}catch(e){}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastLoad>20000)refrescar()});
  addEventListener('online',()=>{renderSync();refrescar()});
  addEventListener('offline',()=>renderSync());
  setInterval(()=>{if(outbox.length)subir()},30000);
  return{
    async ready(){if(loaded){refrescar();live();return}await subir().catch(()=>{});await loadAll();live()},
    tieneCopia:()=>loaded,
    dump(){const out=[];Object.keys(cache).forEach(c=>m(c).forEach((d,id)=>out.push({col:c,id,data:d})));return out},
    async bulk(rows){rows.forEach(r=>{const id=String(r.id);m(r.col).set(id,r.data);outbox=outbox.filter(x=>!(x.col===r.col&&x.id===id));outbox.push({op:'set',col:r.col,id,data:r.data,ts:Date.now()})});guardarCola();emitAll();await subir()},
    collection(c){return{
      doc(id){id=id||rid();return{id,
        async set(d){const data=JSON.parse(JSON.stringify(d));m(c).set(id,data);emit(c,id);encolar('set',c,id,data)},
        async delete(){m(c).delete(id);emit(c,id);encolar('del',c,id)}}},
      onSnapshot(next){(colL[c]||(colL[c]=[])).push(next);if(loaded)setTimeout(()=>next(colSnap(c)),0);return()=>{colL[c]=colL[c].filter(f=>f!==next)}}}},
    doc(p){const[c,id]=p.split('/');return{onSnapshot(next){(docL[p]||(docL[p]=[])).push(next);if(loaded)setTimeout(()=>next(docSnap(c,id)),0);return()=>{docL[p]=docL[p].filter(f=>f!==next)}}}}
  };
}
const DL={async save({filename,data}){const type=/\.csv$/.test(filename)?'text/csv;charset=utf-8':'application/json';const blob=data instanceof Blob?data:new Blob([data],{type});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:'saved'}}};
const OLD_MAP={movimientos:'movs',tareas:'tareas',notas:'notas',turnos:'turnos',pagosFijos:'fijos',facturas:'facturas',papeles:'papeles',vehiculos:'vehiculos',services:'servicios'};
async function importar(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('Ese archivo no es un respaldo válido.');return}
  let rows=[];
  if(Array.isArray(j.docs))rows=j.docs.filter(r=>r&&r.col&&r.id!=null&&r.data&&typeof r.data==='object');
  else{if(j.config)rows.push({col:'config',id:'main',data:j.config});if(j.cotizacion)rows.push({col:'cotiz',id:'actual',data:j.cotizacion});
    Object.entries(OLD_MAP).forEach(([k,c])=>(Array.isArray(j[k])?j[k]:[]).forEach(x=>{if(x&&x.id!=null){const d={...x};delete d.id;rows.push({col:c,id:x.id,data:d})}}))}
  if(!rows.length){toast('El respaldo no tiene datos para importar.');return}
  try{await db.bulk(rows);toast(navigator.onLine?`Listo: ${rows.length} registros importados`:`Importados ${rows.length} registros; se suben cuando vuelva internet`)}catch(e){toast('No se pudo importar. Probá de nuevo.')}
}
const DOLAR_API={oficial:'oficial',blue:'blue',bolsa:'mep',contadoconliqui:'ccl',tarjeta:'tarjeta'};
async function actualizarDolar(){
  const c=S.cotiz;const h=HOY();
  if(c&&c.fecha===h&&c.ts&&Date.now()-c.ts<3*3600e3)return;
  try{const r=await fetch('https://dolarapi.com/v1/dolares',{cache:'no-store'});if(!r.ok)return;const arr=await r.json();
    const out={};(Array.isArray(arr)?arr:[]).forEach(x=>{const k=DOLAR_API[x.casa];if(k&&(x.venta||x.compra))out[k]={compra:x.compra??null,venta:x.venta??null}});
    if(!out.oficial&&!out.blue)return;
    const d=new Date();await put('cotiz','actual',{...(c||{}),...out,fecha:h,hora:pad(d.getHours())+':'+pad(d.getMinutes()),fuente:'DolarApi',ts:Date.now()});
  }catch(e){}
}
const sbUrls={};
function filesFromSB(){if(!SB)return null;const B=()=>SB.storage.from('documentos');return{store:'sb',
  async upload(blob,type,ext){const key=UID+'/'+rid()+'.'+(ext||'bin');const{error}=await B().upload(key,blob,{contentType:type,upsert:false,cacheControl:'3600'});
    if(error){const m=String(error.message||error.error||'');throw{code:/exceed|too large|size/i.test(m)?'too_large':/mime|type/i.test(m)?'unsupported_type':'net',message:m}}return{key}},
  async url(k){const c=sbUrls[k];if(c&&c.t>Date.now())return c.u;const{data,error}=await B().createSignedUrl(k,3600);if(error||!data)throw error||new Error('sin url');sbUrls[k]={u:data.signedUrl,t:Date.now()+50*60e3};return data.signedUrl},
  async remove(k){try{await B().remove([k])}catch(e){}}}}
async function boot(){
  db=makeDB();dl=DL;smp=null;owner=true;FILES=filesFromSB();
  const onErr0=()=>{syncErr=true;render()};
  try{await db.ready()}catch(e){onErr0();toast('No se pudieron cargar los datos. Conectate a internet una vez para bajarlos.')}
  S.booting=false;
  if(!db){render();return}
  const onErr=e=>{if(e&&e.code==='revoked'){db=null}syncErr=true;render()};
  COLS.forEach(c=>{try{db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>({id:x.id,...x.data()}));S.loaded.add(c);render()},e=>{S.loaded.add(c);onErr(e)})}catch(e){S.loaded.add(c)}});
  try{db.doc('config/main').onSnapshot(s=>{S.cfg=mergeCfg(s.exists?s.data():{});cfgOk=true;render()},onErr)}catch(e){}
  try{db.doc('cotiz/actual').onSnapshot(s=>{S.cotiz=s.exists?s.data():null;render()},onErr)}catch(e){}
  try{db.doc('boveda/main').onSnapshot(async s=>{S.vdoc=s.exists?s.data():null;S.vloaded=true;
    if(VK&&S.vdoc){try{VI=await unseal(VK,S.vdoc)}catch(x){vLock(false)}}
    if(S.view==='claves')render()},e=>{S.vloaded=true;onErr(e)})}catch(e){S.vloaded=true}
  render();
  actualizarDolar();setInterval(()=>{if(document.visibilityState==='visible')actualizarDolar()},30*60e3);
}

function entrarSinInternet(){let u=null;try{u=JSON.parse(localStorage.getItem(ULT)||'null')}catch(e){}
